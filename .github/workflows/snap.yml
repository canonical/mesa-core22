name: Snap

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  Snap:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'merge_group' || github.repository == github.event.pull_request.head.repo.full_name) && '["amd64","armhf","arm64","ppc64el","s390x"]' || '["amd64"]') }}

    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0  # needed for version determination
        persist-credentials: false

    - name: Build and publish the snap
      id: build-snap
      uses: canonical/actions/build-snap@cb345b48c77065507280f3dd9d4f42299af2d1a6 # release @ 2026.06.25
      with:
        architecture: ${{ matrix.platform }}
        snapcraft-token: ${{ secrets.SNAPCRAFT_TOKEN }}
        launchpad-credentials: ${{ secrets.LAUNCHPAD_CREDENTIALS }}
        launchpad-accept-public-upload: true
        publish: ${{ github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name }}
        publish-channel: edge/pr${{ github.event.number }}

    - name: Test the snap
      if: ${{ matrix.platform == 'amd64' }}
      env:
        SNAP_PATH: ${{ steps.build-snap.outputs.snap-path }}
      run: |
        sudo snap install --dangerous "${SNAP_PATH}"
        sudo snap install mir-test-tools --channel 22/stable
        sudo snap connect mir-test-tools:login-session-control
        sudo snap connect mir-test-tools:graphics-core22 mesa-core22

        sudo adduser $USER video
        sudo adduser $USER input

        sudo -u $USER mir-test-tools.smoke-test

    - if: ${{ failure() && runner.debug }}
      name: Set up tmate session (restart with debug logging to activate)
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      with:
        limit-access-to-actor: true
